name: CLI release

on:
  push:
    tags:
      - cli-v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing CLI tag to release (for example, cli-v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cli-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify CLI bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validate stable CLI tag, version and main history
        id: validate
        run: |
          mkdir -p "$RUNNER_TEMP/cli-assets"
          node scripts/validate-release.mjs tag cli "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/cli-assets/release-notes.md"

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test release preparation and validation
        run: pnpm test

      - name: Build CLI and workspace dependencies
        run: pnpm --filter '@vaia/cli...' --fail-if-no-match -r run build

      - name: Check types
        run: pnpm --filter '@vaia/cli...' --fail-if-no-match -r run typecheck

      - name: Bundle production dependencies
        run: pnpm --filter @vaia/cli --prod deploy --legacy "$RUNNER_TEMP/cli-release/vaia-cli"

      - name: Create archive and checksum
        run: |
          mkdir -p "$RUNNER_TEMP/cli-assets"
          archive="vaia-${RELEASE_TAG}-linux-x64.tar.gz"
          tar -czf "$RUNNER_TEMP/cli-assets/$archive" -C "$RUNNER_TEMP/cli-release" vaia-cli
          cd "$RUNNER_TEMP/cli-assets"
          sha256sum "$archive" > SHA256SUMS

      - name: Verify the extracted release
        run: |
          cd "$RUNNER_TEMP/cli-assets"
          sha256sum --check SHA256SUMS
          mkdir -p "$RUNNER_TEMP/cli-smoke"
          tar -xzf "vaia-${RELEASE_TAG}-linux-x64.tar.gz" -C "$RUNNER_TEMP/cli-smoke"
          cd "$RUNNER_TEMP/cli-smoke/vaia-cli"
          node dist/bin/run.js --help
          node dist/bin/run.js flashcards list --help
          node dist/bin/run.js config show

      - name: Upload verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-release
          path: ${{ runner.temp }}/cli-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-release
          path: release-assets

      - name: Publish release with the prepared changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          cd release-assets
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.tar.gz SHA256SUMS \
            --verify-tag \
            --title "Vaia CLI $RELEASE_TAG" \
            --notes-file release-notes.md
