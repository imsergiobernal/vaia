name: Prepare release branch

on:
  push:
    branches: ['release/**', 'hotfix/**']

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare changelog and release PR
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Check out the stabilization branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validate component and target version before authentication
        run: node scripts/validate-release.mjs branch "$RELEASE_BRANCH"

      - name: Check GitHub App configuration
        env:
          APP_ID: ${{ vars.RELEASE_PLEASE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo '::error::Configure the RELEASE_PLEASE_APP_ID repository variable and RELEASE_PLEASE_APP_PRIVATE_KEY secret. Install the App only on this repository with Contents, Pull requests and Issues write permissions.'
            exit 1
          fi

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false

      - name: Install the locked Release Please version
        run: pnpm install --frozen-lockfile

      - name: Create a token limited to this repository
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Verify the release PR base exists
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh api "repos/$GH_REPO/branches/main" --silent; then
            echo '::error::The GitHub App cannot access the main branch. Create or restore main before preparing a release.'
            exit 1
          fi

      - name: Stop if this release PR was already merged
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          merged="$(gh pr list --head "$RELEASE_BRANCH" --base main --state merged --json number --jq '.[0].number // empty')"
          if [[ -n "$merged" ]]; then
            echo "::error::Release PR #$merged is already merged. Do not prepare this branch again."
            exit 1
          fi

      - name: Prepare the changelog on the release branch
        env:
          RELEASE_PLEASE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: pnpm release:prepare "$RELEASE_BRANCH"

      - name: Commit prepared notes and open the release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          component="${RELEASE_BRANCH##*/}"
          component="${component%%-v*}"
          version="${RELEASE_BRANCH##*-v}"
          case "$component" in
            cli) changelog=apps/cli/CHANGELOG.md ;;
            sdk) changelog=packages/sdk/CHANGELOG.md ;;
            *) exit 1 ;;
          esac
          if [[ -n "$(git status --porcelain -- "$changelog")" ]]; then
            git add -- "$changelog"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "docs(release): prepare $component $version notes"
            gh auth setup-git
            git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          fi
          if [[ ! -f "$changelog" ]]; then
            echo '::error::No changelog was prepared; add release notes before creating the PR.'
            exit 1
          fi
          node --input-type=module -e 'import { validateReleaseBranch } from "./scripts/validate-release.mjs"; import { readReleaseNotes } from "./scripts/release-notes.mjs"; readReleaseNotes(validateReleaseBranch(process.env.RELEASE_BRANCH));'
          existing="$(gh pr list --head "$RELEASE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh pr create --head "$RELEASE_BRANCH" --base main \
              --title "chore($component): prepare $version" \
              --body "Review the $component $version release and its changelog before merging."
          else
            echo "Release PR #$existing already exists."
          fi
